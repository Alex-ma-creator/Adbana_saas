services:
  app:
    build: .
    command: ["sh", "-c", "chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && exec php-fpm"]
    volumes:
      - ./src:/var/www
      - ./php-fpm.conf:/usr/local/etc/php-fpm.d/zz-pool.conf
    depends_on: [db, redis]

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adbana
      POSTGRES_USER: adbana
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env de la raiz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine

  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on: [db]

volumes:
  pgdata:

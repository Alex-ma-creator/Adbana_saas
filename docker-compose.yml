services:
  app:
    build: .
    command: ["sh", "-c", "chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && composer dump-autoload --optimize --classmap-authoritative --no-interaction && php artisan route:cache && php artisan view:cache && exec php-fpm"]
    volumes:
      - ./src:/var/www
      - ./php-fpm.conf:/usr/local/etc/php-fpm.d/zz-pool.conf
      - ./opcache.ini:/usr/local/etc/php/conf.d/99-opcache.ini
    depends_on: [db, redis]

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]

  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=350", "-c", "shared_buffers=512MB", "-c", "work_mem=16MB", "-c", "wal_buffers=16MB", "-c", "synchronous_commit=off", "-c", "checkpoint_completion_target=0.9", "-c", "max_wal_size=2GB"]
    environment:
      POSTGRES_DB: adbana
      POSTGRES_USER: adbana
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env de la raiz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine

  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on: [db]

volumes:
  pgdata:

# ====================================================================
# SonarCloud Configuration - Adbana SaaS
# ====================================================================

# Directorios principales de código fuente
sonar.sources=src/app,src/routes,flutter/lib

# Directorios de pruebas automatizadas
sonar.tests=src/tests,flutter/test

# Codificación de caracteres
sonar.sourceEncoding=UTF-8

# Exclusiones de escaneo (código de terceros, assets y archivos compilados)
sonar.exclusions=src/vendor/**,src/public/**,src/storage/**,flutter/build/**,flutter/.dart_tool/**,tools/**,k6/**,deploy/**,node_modules/**,**/*.min.js,**/*.min.css

# Exclusiones de cobertura (no exigir test coverage a migraciones, configs ni pruebas)
sonar.coverage.exclusions=src/tests/**,flutter/test/**,src/database/**,src/config/**,src/resources/**,flutter/lib/main.dart

# Ubicación del reporte de cobertura generado por PHPUnit
sonar.php.coverage.reportPaths=src/coverage.xml

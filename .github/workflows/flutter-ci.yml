name: Flutter Mobile CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  flutter-checks:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dart/Flutter Packages
        run: flutter pub get

      - name: Run Static Code Analysis (Linter)
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test

[www]
pm = dynamic
pm.max_children = 64
pm.start_servers = 16
pm.min_spare_servers = 8
pm.max_spare_servers = 32
pm.max_requests = 20000
request_terminate_timeout = 120s
listen.backlog = 2048

; Optimizaciones OPcache y límites de memoria
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 512
php_admin_value[opcache.interned_strings_buffer] = 64
php_admin_value[opcache.max_accelerated_files] = 32531
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[realpath_cache_size] = 64M
php_admin_value[realpath_cache_ttl] = 3600

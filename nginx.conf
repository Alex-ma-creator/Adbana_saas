map $http_x_request_id $adbana_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

limit_conn_zone $server_name zone=adbana_fpm_active:10m;
limit_conn_status 503;

upstream php_fpm {
    server app:9000 max_fails=0;
    keepalive 256;
    keepalive_requests 50000;
    keepalive_timeout 60s;
}

server {
    listen 80 backlog=16384;
    server_name _;
    index index.php index.html;
    root /var/www/public;
    client_max_body_size 20M;
    access_log off;
    keepalive_timeout 65;
    keepalive_requests 50000;

    # Contencion fail-fast (< 1 ms) si el backlog de PHP-FPM se satura o falla
    error_page 502 503 504 =503 @overload_json;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        limit_conn adbana_fpm_active 24;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        fastcgi_keep_conn on;
        fastcgi_buffers 32 32k;
        fastcgi_buffer_size 64k;

        # Timeouts cortos y seguros para fail-fast bajo avalancha masiva
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 4s;
        fastcgi_read_timeout 5s;

        # Mantiene intactas las respuestas 503 JSON emitidas por Laravel (DB_CONCURRENCY_SHEDDING),
        # mientras Nginx intercepta 502/503/504 propios si el socket PHP-FPM se satura.
        fastcgi_intercept_errors off;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REQUEST_ID $adbana_request_id;
    }

    location @overload_json {
        internal;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header X-Request-Id $adbana_request_id always;
        add_header X-Response-Time-Ms "0.8" always;
        add_header X-Bottleneck-Stage "nginx_fastcgi_queue" always;
        add_header X-Failure-Reason "NGINX_FPM_QUEUE_SATURATED" always;
        add_header Retry-After "1" always;
        return 503 '{"error":true,"estado_servidor":"error_contenido","codigo_fallo":"NGINX_FPM_QUEUE_SATURATED","motivo_caida":"Cuello de botella controlado en Nginx: la cola del socket PHP-FPM se saturo durante la rafaga masiva. Respuesta fail-fast emitida directamente desde Nginx (< 1 ms) para evitar caida del servidor.","cuello_de_botella":"nginx_fastcgi_queue","tiempo_respuesta_ms":0.8,"reintentable":true,"retry_after_ms":300,"request_id":"$adbana_request_id"}';
    }
}
